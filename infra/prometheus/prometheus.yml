global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'auth-service:8081'
          - 'order-service:8082'
          - 'product-service:8083'
          - 'kitchen-service:8084'
          - 'payment-service:8088'
          - 'inventory-service:8089'
          - 'restaurant-service:8087'
          - 'api-gateway:8080'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
