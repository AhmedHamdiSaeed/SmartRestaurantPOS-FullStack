server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:4200"
              - "http://localhost:4201"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/orders/**
        - id: order-websocket
          uri: ${ORDER_WS_URL:ws://localhost:8082}
          predicates:
            - Path=/ws/orders/**
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/products/**
        - id: kitchen-service
          uri: ${KITCHEN_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/kitchen/**
        - id: kitchen-websocket
          uri: ${KITCHEN_WS_URL:ws://localhost:8084}
          predicates:
            - Path=/ws/kitchen/**
        - id: ai-service
          uri: ${AI_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/ai/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/offline/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  jwt:
    secret: SmartPOS-Secret-Key-2024-VeryLongAndSecure-256bit!!

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: 🔐 Auth Service
        url: /api/v1/auth/v3/api-docs
      - name: 📋 Order Service
        url: /api/v1/orders/v3/api-docs
      - name: 🍔 Product Service
        url: /api/v1/products/v3/api-docs
      - name: 👨‍🍳 Kitchen Service
        url: /api/v1/kitchen/v3/api-docs
      - name: 🤖 AI Service
        url: /api/v1/ai/v3/api-docs
      - name: 🔔 Notification Service
        url: /api/v1/offline/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
